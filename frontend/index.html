<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Precificação</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-header"><h1 class="logo"> Sistema Precificador</h1><button class="menu-toggle" id="menuToggle">☰</button></div>
        <nav class="sidebar-nav">
          <a href="#/dashboard" class="nav-link active" data-page="dashboard">  Dashboard </a>
          <a href="#/price-changes" class="nav-link" data-page="price-changes"> Alterações de Preço</a>
          <a href="#/products" class="nav-link" data-page="products"> Produtos</a>
          <a href="#/stores" class="nav-link" data-page="stores"> Lojas</a>
          <hr />
          <a href="#/settings" class="nav-link" data-page="settings"> Configurações</a>
          <a href="#" id="logoutBtn" class="nav-link nav-link--danger"> Logout</a>
        </nav>
      </aside>
      <div class="main-wrapper">
        <header class="header"><div class="header-left"><h2 id="pageTitle">Dashboard</h2></div><div class="header-right"><div class="user-menu"><span id="userName">Usuário</span><img src="css/avatar.svg" alt="Avatar" class="avatar" /></div></div></header>
        <main class="content" id="content"></main>
      </div>
    </div>
    <div id="loginModal" class="modal modal--active"><div class="modal-overlay"></div><div class="modal-content"><div class="modal-header"><h2>Login</h2></div><form id="loginForm" class="form"><div class="form-group"><label for="email">Email:</label><input type="email" id="email" name="email" required class="form-input" /></div><div class="form-group"><label for="password">Senha:</label><input type="password" id="password" name="password" required class="form-input" /></div><div class="form-group"><button type="submit" class="btn btn--primary btn--block">Entrar</button></div></form></div></div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="js/api.js"></script><script src="js/store.js"></script><script src="js/components/modal.js"></script><script src="js/components/form.js"></script><script src="js/pages/dashboard.js"></script><script src="js/pages/price-changes.js"></script><script src="js/pages/products.js"></script><script src="js/pages/stores.js"></script><script src="js/pages/settings.js"></script><script src="js/app.js"></script>
  </body>
</html>
