<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Precificação</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1 class="logo">Sistema Precificador</h1>
          <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
        <nav class="sidebar-nav">
          <a href="#/dashboard" class="nav-link active" data-page="dashboard">
            Dashboard
          </a>
          <a href="#/price-changes" class="nav-link" data-page="price-changes"

          <a href="#" id="logoutBtn" class="nav-link nav-link--danger"

        <main class="content" id="content"></main>

    <div id="toastContainer" class="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/price-changes.js"></script>
