name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/*.py
      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in frontend/js/api.js frontend/js/app.js frontend/js/store.js frontend/js/pages/*.js frontend/js/components/*.js; do
            node --check "$file"
          done

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        env:
          SECRET_KEY: ci-only-secret-key-change-me-32-chars
          JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --tag price-tracker-api:test .
      - name: Build frontend image
        run: docker build --tag price-tracker-frontend:test ./frontend

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: price_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d price_tracker"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run PostgreSQL integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/price_tracker
        run: pytest -q
